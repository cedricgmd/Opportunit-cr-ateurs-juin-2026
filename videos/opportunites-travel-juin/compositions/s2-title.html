<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding: 0 96px;
        }

        #s2-stack { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .s2-pill { display: inline-flex; align-items: center; gap: 18px; border: 2px solid var(--terracotta-light);
          color: var(--terracotta-light); font-size: 26px; font-weight: 500; letter-spacing: 6px;
          text-transform: uppercase; padding: 18px 36px; border-radius: 60px; margin-bottom: 60px; }
        .s2-mask { overflow: hidden; display: block; padding: 0 20px 40px; margin-bottom: -40px; }
        #s2-t1 { font-size: 128px; font-weight: 700; line-height: 1.1; }
        #s2-t2 { font-size: 250px; font-weight: 700; line-height: 1.3; }
        #s2-date { display: flex; align-items: center; gap: 32px; margin-top: 18px; width: 760px; }
        .s2-rule { flex: 1; height: 3px; background: var(--gold); transform-origin: 50% 50%; display: block; }
        #s2-date-text { font-size: 60px; font-weight: 400; letter-spacing: 4px; }
        #s2-sub { margin-top: 52px; font-size: 38px; font-weight: 300; color: var(--body); line-height: 1.45; max-width: 820px; }
        #s2-urgent { margin-top: 64px; display: inline-flex; align-items: center; gap: 22px;
          background: rgba(196,103,74,0.18); border: 2px solid rgba(232,137,110,0.55); color: var(--terracotta-light);
          font-size: 34px; font-weight: 500; padding: 22px 40px; border-radius: 60px; }
        #s2-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--terracotta-light); display: block; }
      </style>
      <div id="root" data-composition-id="s2-title" data-width="1080" data-height="1920">
        <div id="s2-stack">
          <div class="s2-pill" id="s2-pill">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#e8896e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
            Sélectionné pour les créateurs
          </div>
          <span class="s2-mask"><span class="line serif" id="s2-t1">Opportunités</span></span>
          <span class="s2-mask"><span class="line gold-italic" id="s2-t2">Travel</span></span>
          <div id="s2-date">
            <span class="s2-rule" id="s2-rule-l"></span>
            <span class="serif" id="s2-date-text">Juin 2026</span>
            <span class="s2-rule" id="s2-rule-r"></span>
          </div>
          <p id="s2-sub">Worldwide — Collabs, UGC, Press Trips &amp; Jobs</p>
          <div id="s2-urgent"><span id="s2-dot"></span>Deadlines : fin juin</div>
        </div>
      </div>
      <script>
        (function () {
        const tl = gsap.timeline({ paused: true });

        const F = 1 / 30;
        // Waterfall arrival: binary reveal + whip up from below.
        function waterfall(items, t) {
          items.forEach(([sel, y, dur]) => {
            tl.set(sel, { opacity: 1, y: y }, t);
            tl.to(sel, { y: 0, duration: dur, ease: "power4.out" }, t);
            t += dur - F;
          });
          return t;
        }
        function hide(sels) { sels.forEach((s) => tl.set(s, { opacity: 0 }, 0)); }
        function fmt(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }

        tl.fromTo("#s2-pill", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.05);
        tl.fromTo("#s2-t1", { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.25);
        tl.fromTo("#s2-t2", { yPercent: 110, rotation: 4 }, { yPercent: 0, rotation: 0, duration: 0.8, ease: "expo.out" }, 0.42);
        tl.fromTo(["#s2-rule-l", "#s2-rule-r"], { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.9);
        tl.fromTo("#s2-date-text", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" }, 0.9);
        tl.fromTo("#s2-sub", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.25);
        tl.fromTo("#s2-urgent", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.6);
        tl.fromTo("#s2-dot", { scale: 1, opacity: 1 }, { scale: 1.7, opacity: 0.55, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.0);
        tl.fromTo("#s2-stack", { scale: 1, opacity: 1 }, { scale: 1.03, opacity: 1, duration: 3.9, ease: "none" }, 0);
        tl.to("#s2-stack", { opacity: 0, scale: 0.94, duration: 0.4, ease: "power2.in" }, 3.95);
        window.__timelines["s2-title"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
