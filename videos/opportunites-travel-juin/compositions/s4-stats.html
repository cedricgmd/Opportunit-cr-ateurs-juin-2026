<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding: 0 96px;
        }

        #s4-eyebrow { display: flex; align-items: center; gap: 18px; color: var(--gold); margin-bottom: 40px; }
        .s4-stat { display: flex; flex-direction: column; }
        .s4-num-wrap { display: flex; align-items: baseline; width: 820px; }
        .s4-num { display: inline-block; font-family: "Playfair Display", serif; font-weight: 900; font-size: 240px;
          line-height: 1; color: var(--sand); font-variant-numeric: tabular-nums; white-space: nowrap; transform-origin: 0% 100%; }
        .s4-plus { display: inline-block; font-family: "Playfair Display", serif; font-weight: 700; font-size: 170px;
          color: var(--terracotta-light); margin-left: 10px; }
        .s4-label { font-size: 36px; font-weight: 500; letter-spacing: 5px; text-transform: uppercase; color: var(--body);
          margin-top: 8px; line-height: 1.35; max-width: 860px; }
        #s4-rule { width: 100%; height: 3px; background: rgba(245,240,232,0.18); margin: 56px 0; transform-origin: 0 50%; display: block; }
        #s4-line { margin-top: 70px; font-family: "Playfair Display", serif; font-size: 66px; line-height: 1.25; }
        #s4-hl { position: relative; display: inline-block; font-style: italic; color: var(--deep); padding: 0 16px; background: var(--gold); border-radius: 10px; }
        #s4-hl-text { position: relative; }
      </style>
      <div id="root" data-composition-id="s4-stats" data-width="1080" data-height="1920">
        <div class="eyebrow" id="s4-eyebrow">
          <svg width="30" height="30" viewBox="0 0 24 24"><path fill="#d4a853" d="M12 0 L14.6 9.4 L24 12 L14.6 14.6 L12 24 L9.4 14.6 L0 12 L9.4 9.4 Z"/></svg>
          Un mot de Cédric
        </div>
        <div class="s4-stat" id="s4-stat1">
          <div class="s4-num-wrap"><span class="s4-num" id="s4-n1">0</span><span class="s4-plus" id="s4-p1">+</span></div>
          <div class="s4-label" id="s4-l1">Marques &amp; établissements</div>
        </div>
        <span id="s4-rule"></span>
        <div class="s4-stat" id="s4-stat2">
          <div class="s4-num-wrap"><span class="s4-num" id="s4-n2">0</span><span class="s4-plus" id="s4-p2">+</span></div>
          <div class="s4-label" id="s4-l2">Hôtels qui acceptent les petits créateurs</div>
        </div>
        <p id="s4-line">
          <span class="line" id="s4-line-a">Obtenues avec</span>
          <span id="s4-hl"><span id="s4-hl-text">moins de 1 000 abonnés.</span></span>
        </p>
      </div>
      <script>
        (function () {
        const tl = gsap.timeline({ paused: true });

        const F = 1 / 30;
        // Waterfall arrival: binary reveal + whip up from below.
        function waterfall(items, t) {
          items.forEach(([sel, y, dur]) => {
            tl.set(sel, { opacity: 1, y: y }, t);
            tl.to(sel, { y: 0, duration: dur, ease: "power4.out" }, t);
            t += dur - F;
          });
          return t;
        }
        function hide(sels) { sels.forEach((s) => tl.set(s, { opacity: 0 }, 0)); }
        function fmt(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }

        hide(["#s4-line-a"]);
        tl.fromTo("#s4-eyebrow", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.05);
        const n1 = document.getElementById("s4-n1"), n2 = document.getElementById("s4-n2");
        const c41 = { v: 0 }, c42 = { v: 0 };
        tl.fromTo(c41, { v: 0 }, { v: 2000, duration: 1.6, ease: "power3.out", onUpdate: () => { n1.textContent = fmt(c41.v); } }, 0.2);
        tl.fromTo("#s4-n1", { scale: 0.5 }, { scale: 1, duration: 1.6, ease: "power3.out" }, 0.2);
        tl.fromTo("#s4-p1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, 1.8);
        tl.fromTo("#s4-l1", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.6);
        tl.fromTo("#s4-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 1.6);
        tl.fromTo("#s4-stat2", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 1.85);
        tl.fromTo(c42, { v: 0 }, { v: 1000, duration: 1.4, ease: "power3.out", immediateRender: false, onUpdate: () => { n2.textContent = fmt(c42.v); } }, 1.9);
        tl.fromTo("#s4-n2", { scale: 0.5 }, { scale: 1, duration: 1.4, ease: "power3.out" }, 1.9);
        tl.fromTo("#s4-p2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, 3.3);
        tl.fromTo("#s4-l2", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.2);
        waterfall([["#s4-line-a", 50, 0.18]], 3.35);
                tl.fromTo("#s4-hl", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "expo.out" }, 3.5);
        tl.to(["#s4-eyebrow", "#s4-stat1", "#s4-rule", "#s4-stat2", "#s4-line"], { opacity: 0, y: -70, duration: 0.35, ease: "power3.in", stagger: 0.03 }, 5.1);
        window.__timelines["s4-stats"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
