<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding: 0 96px;
        }

        #s1-label { margin-bottom: 56px; }
        #s1-title { font-weight: 700; line-height: 1.02; }
        #s1-a, #s1-b { font-size: 156px; }
        #s1-b { color: var(--body); font-weight: 400; font-style: italic; }
        #s1-c { font-size: 196px; }
        #s1-bar { width: 600px; height: 10px; margin-top: 30px; background: var(--terracotta);
          border-radius: 5px; transform-origin: 0 50%; }
      </style>
      <div id="root" data-composition-id="s1-hook" data-width="1080" data-height="1920">
        <div class="eyebrow" id="s1-label">Pour les créateurs de contenu</div>
        <h1 class="serif" id="s1-title">
          <span class="line" id="s1-a">Être payé·e</span>
          <span class="line" id="s1-b">pour</span>
          <span class="line gold-italic" id="s1-c">voyager ?</span>
        </h1>
        <div id="s1-bar"></div>
      </div>
      <script>
        (function () {
        const tl = gsap.timeline({ paused: true });

        const F = 1 / 30;
        // Waterfall arrival: binary reveal + whip up from below.
        function waterfall(items, t) {
          items.forEach(([sel, y, dur]) => {
            tl.set(sel, { opacity: 1, y: y }, t);
            tl.to(sel, { y: 0, duration: dur, ease: "power4.out" }, t);
            t += dur - F;
          });
          return t;
        }
        function hide(sels) { sels.forEach((s) => tl.set(s, { opacity: 0 }, 0)); }
        function fmt(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }

        hide(["#s1-a", "#s1-b", "#s1-c"]);
        tl.fromTo("#s1-label", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.15);
        const t = waterfall([["#s1-a", 80, 0.22], ["#s1-b", 50, 0.16], ["#s1-c", 90, 0.24]], 0.45);
        tl.fromTo("#s1-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "expo.out" }, t + 0.1);
        tl.fromTo("#s1-c", { scale: 1 }, { scale: 1.04, duration: 1.8, ease: "sine.inOut", transformOrigin: "0% 50%" }, t + 0.2);
        tl.to(["#s1-label", "#s1-a", "#s1-b", "#s1-c", "#s1-bar"], { y: -90, opacity: 0, duration: 0.4, ease: "power3.in", stagger: 0.04 }, 3.1);
        window.__timelines["s1-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
