<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          pointer-events: none;
        }

        @keyframes hf-grain-noise {
          0%, 100% { transform: translate(0, 0); }
          10% { transform: translate(-5%, -5%); }
          20% { transform: translate(-10%, 5%); }
          30% { transform: translate(5%, -10%); }
          40% { transform: translate(-5%, 15%); }
          50% { transform: translate(-10%, 5%); }
          60% { transform: translate(15%, 0); }
          70% { transform: translate(0, 10%); }
          80% { transform: translate(-15%, 0); }
          90% { transform: translate(10%, 5%); }
        }
        #grain-texture { position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
          background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
          opacity: 0.12; animation: hf-grain-noise 0.5s steps(1) infinite; }
      </style>
      <div id="root" data-composition-id="grain" data-width="1080" data-height="1920">
        <div id="grain-texture"></div>
      </div>
      <script>
        (function () {
        const tl = gsap.timeline({ paused: true });

        const F = 1 / 30;
        // Waterfall arrival: binary reveal + whip up from below.
        function waterfall(items, t) {
          items.forEach(([sel, y, dur]) => {
            tl.set(sel, { opacity: 1, y: y }, t);
            tl.to(sel, { y: 0, duration: dur, ease: "power4.out" }, t);
            t += dur - F;
          });
          return t;
        }
        function hide(sels) { sels.forEach((s) => tl.set(s, { opacity: 0 }, 0)); }
        function fmt(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }

        window.__timelines["grain"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
