      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--deep); }

        color: var(--sand);

        font-weight: 400;

      #main-root > div { position: absolute; inset: 0; }
      .serif { font-family: "Playfair Display", serif; }
      .gold-italic { font-family: "Playfair Display", serif; font-style: italic; color: var(--gold); }
      .eyebrow { font-size: 26px; font-weight: 500; letter-spacing: 7px; text-transform: uppercase; color: var(--terracotta-light); }
